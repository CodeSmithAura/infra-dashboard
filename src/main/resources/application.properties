# ═══════════════════════════════════════════════════════════════
#  InfraWatch — application.properties  (v2.0.0)
# ═══════════════════════════════════════════════════════════════

# ── Server ──────────────────────────────────────────────────────
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173,http://localhost:8090
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization

# ── Logging ─────────────────────────────────────────────────────
quarkus.log.level=INFO
quarkus.log.category."com.infrawatch".level=DEBUG

# ── Scheduler ───────────────────────────────────────────────────
infrawatch.collection.cron=0 */5 * * * ?

# ═══════════════════════════════════════════════════════════════
#  Platform Integration Credentials
#  Override via environment variables in production.
# ═══════════════════════════════════════════════════════════════

# 1. SolarWinds Observability (LAN)
infrawatch.solarwinds.url=${INFRAWATCH_SOLARWINDS_URL:}
infrawatch.solarwinds.api-token=${INFRAWATCH_SOLARWINDS_API_TOKEN:}

# 2. HPE Aruba Central (WAN / SD-WAN)
infrawatch.aruba.url=${INFRAWATCH_ARUBA_URL:}
infrawatch.aruba.client-id=${INFRAWATCH_ARUBA_CLIENT_ID:}
infrawatch.aruba.client-secret=${INFRAWATCH_ARUBA_CLIENT_SECRET:}

# 3. ManageEngine PAM360
infrawatch.pam360.url=${INFRAWATCH_PAM360_URL:}
infrawatch.pam360.api-key=${INFRAWATCH_PAM360_API_KEY:}

# 4. Microsoft Azure (AVD + Resource Health)
infrawatch.azure.tenant-id=${INFRAWATCH_AZURE_TENANT_ID:}
infrawatch.azure.client-id=${INFRAWATCH_AZURE_CLIENT_ID:}
infrawatch.azure.client-secret=${INFRAWATCH_AZURE_CLIENT_SECRET:}
infrawatch.azure.subscription-id=${INFRAWATCH_AZURE_SUBSCRIPTION_ID:}

# 5. Palo Alto Panorama (VPN XML API)
infrawatch.panorama.url=${INFRAWATCH_PANORAMA_URL:}
infrawatch.panorama.api-key=${INFRAWATCH_PANORAMA_API_KEY:}

# 6. Axonius (Vulnerability Scoring)
infrawatch.axonius.url=${INFRAWATCH_AXONIUS_URL:}
infrawatch.axonius.api-key=${INFRAWATCH_AXONIUS_API_KEY:}
infrawatch.axonius.api-secret=${INFRAWATCH_AXONIUS_API_SECRET:}

# ═══════════════════════════════════════════════════════════════
#  Redpanda / Kafka (SmallRye Reactive Messaging)
# ═══════════════════════════════════════════════════════════════
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:redpanda:9092}

# Producer: Java backend publishes snapshots
mp.messaging.outgoing.infrawatch-snapshots.connector=smallrye-kafka
mp.messaging.outgoing.infrawatch-snapshots.topic=infrawatch-snapshots
mp.messaging.outgoing.infrawatch-snapshots.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.infrawatch-snapshots.key.serializer=org.apache.kafka.common.serialization.StringSerializer

# Consumer: Iceberg analytics writer (own consumer group)
mp.messaging.incoming.infrawatch-snapshots-iceberg.connector=smallrye-kafka
mp.messaging.incoming.infrawatch-snapshots-iceberg.topic=infrawatch-snapshots
mp.messaging.incoming.infrawatch-snapshots-iceberg.group.id=infrawatch-iceberg-writer
mp.messaging.incoming.infrawatch-snapshots-iceberg.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.infrawatch-snapshots-iceberg.auto.offset.reset=earliest

# ═══════════════════════════════════════════════════════════════
#  Apache Iceberg + MinIO
# ═══════════════════════════════════════════════════════════════
infrawatch.iceberg.catalog-url=${ICEBERG_REST_URI:http://iceberg-rest:8181}
infrawatch.iceberg.warehouse=${ICEBERG_WAREHOUSE:s3://infrawatch-lake/warehouse}
infrawatch.minio.endpoint=${MINIO_ENDPOINT:http://minio:9000}
infrawatch.minio.access-key=${MINIO_ROOT_USER:infrawatch}
infrawatch.minio.secret-key=${MINIO_ROOT_PASSWORD:infrawatch123}

# ═══════════════════════════════════════════════════════════════
#  File-based data sources (existing)
# ═══════════════════════════════════════════════════════════════
infrawatch.data.locations-file=locations.csv
infrawatch.data.services-file=services.json
infrawatch.data.custom-file=custom-metrics.tsv

# ── Dev / test profiles ─────────────────────────────────────────
%dev.quarkus.log.category."com.infrawatch".level=DEBUG
%dev.infrawatch.collection.cron=0 */1 * * * ?
%test.quarkus.log.level=WARN

