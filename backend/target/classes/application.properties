# ── Application ──────────────────────────────────────────────────────────────
quarkus.application.name=infrawatch-backend
quarkus.http.port=8080

# ── CORS (allow React dev server) ────────────────────────────────────────────
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173,http://localhost:3000
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,X-Requested-With

# ── Storage Mode: file | h2 | postgres | redis ────────────────────────────────
# Change this to switch the active storage backend
infrawatch.storage.mode=h2

# ── File Storage ──────────────────────────────────────────────────────────────
infrawatch.storage.file.path=./data
infrawatch.storage.file.format=json
# format options: json | csv | parquet-like (ndjson)

# ── Database (H2 in-memory — dev/demo) ───────────────────────────────────────
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:infrawatch;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false

# ── PostgreSQL (production) ───────────────────────────────────────────────────
# Uncomment and set values to switch to Postgres
# infrawatch.storage.mode=postgres
# quarkus.datasource.db-kind=postgresql
# quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/infrawatch
# quarkus.datasource.username=infrawatch
# quarkus.datasource.password=secret
# quarkus.hibernate-orm.database.generation=update

# ── Redis (cache / fast reads) ────────────────────────────────────────────────
quarkus.redis.hosts=redis://localhost:6379
infrawatch.cache.ttl-seconds=30

# ── ServiceNow ───────────────────────────────────────────────────────────────
infrawatch.servicenow.base-url=https://YOUR_INSTANCE.service-now.com
infrawatch.servicenow.username=admin
infrawatch.servicenow.password=secret
infrawatch.servicenow.table=cmdb_ci_server
infrawatch.servicenow.enabled=false

# ── Prometheus ────────────────────────────────────────────────────────────────
infrawatch.prometheus.base-url=http://localhost:9090
infrawatch.prometheus.enabled=false

# ── Datadog ───────────────────────────────────────────────────────────────────
infrawatch.datadog.base-url=https://api.datadoghq.com
infrawatch.datadog.api-key=YOUR_DD_API_KEY
infrawatch.datadog.app-key=YOUR_DD_APP_KEY
infrawatch.datadog.enabled=false

# ── Polling scheduler (cron: every 60s) ──────────────────────────────────────
infrawatch.polling.cron=0/59 * * * * ?

# ── OpenAPI ──────────────────────────────────────────────────────────────────
quarkus.smallrye-openapi.info-title=InfraWatch API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Infrastructure availability API — aggregated from ServiceNow, Prometheus, Datadog
quarkus.swagger-ui.always-include=true

# ── Logging ──────────────────────────────────────────────────────────────────
quarkus.log.level=INFO
quarkus.log.category."com.infrawatch".level=DEBUG

# ──────────────────────────────────────────────────────────────────────────────
# File-based data source
# ──────────────────────────────────────────────────────────────────────────────
# Enable this block when API access is unavailable (air-gapped / demo / dev).
# The file source can act as a graceful fallback (fallback-only=true, default)
# or as the primary source regardless of API availability (fallback-only=false).

infrawatch.file-source.enabled=false

# Path to the data file.
#   Absolute:   /opt/infrawatch/data/locations.csv
#   Relative:   data/locations.csv  (resolved from working directory)
#   Classpath:  classpath:data/locations.csv
infrawatch.file-source.path=classpath:data/sample-locations.csv

# Format: csv | tsv | json | custom
infrawatch.file-source.format=csv

# Field separator for csv/tsv/custom.
# Use \t for tab, | for pipe, ; for semicolon.
infrawatch.file-source.separator=,

# Whether the first row is a column header (skipped during parsing).
infrawatch.file-source.has-header=true

# Character encoding of the file.
infrawatch.file-source.encoding=UTF-8

# true  = only use file when all API sources have failed (recommended default)
# false = always use file, never call APIs (air-gap / demo mode)
infrawatch.file-source.fallback-only=true

# Optional label shown in the UI data-source badge (defaults to filename).
# infrawatch.file-source.label=Offline Dataset